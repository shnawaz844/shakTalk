# ==============================================================================
# ShakTalk Nginx Configuration Changes (Developer Brief Sections 5 & 18)
# ==============================================================================
# IMPORTANT (Rule 4):
# Nginx's `add_header` directive does NOT inherit from parent `server` or `http`
# blocks if a `location` block defines its own `add_header`.
# Any security headers configured at the server level must be repeated inside
# location blocks that define caching headers.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP (Port 80) -> HTTPS Redirect for both bare domain and www
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name shaktalk.com www.shaktalk.com;

    # Let's Encrypt / Certbot ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 301 Redirect all HTTP traffic to HTTPS www.shaktalk.com preserving URI (e.g. /join/...)
    location / {
        return 301 https://www.shaktalk.com$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS (Port 443) Bare-Domain 301 Redirect (Brief Section 5)
#    Redirects https://shaktalk.com/... to https://www.shaktalk.com/...
#    Ensures search engines index www as canonical and invite links (/join/...) work.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shaktalk.com;

    # SSL Certificate lines (use your existing live certificate paths)
    ssl_certificate /etc/letsencrypt/live/shaktalk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shaktalk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 301 Redirect to canonical www domain preserving query string and path
    return 301 https://www.shaktalk.com$request_uri;
}

# ------------------------------------------------------------------------------
# 3. Main Server Block: https://www.shaktalk.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shaktalk.com;

    # SSL Certificate configuration
    ssl_certificate /etc/letsencrypt/live/shaktalk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shaktalk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root directory for static website assets
    root /var/www/shaktalk/backend/public;
    index index.html;

    # Server-level Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Static Assets: Immutable Cache Headers (Brief Section 18)
    # Serves images, fonts, and icons with a 1-year immutable cache.
    # Note: Security headers repeated here because Nginx add_header in a location
    # replaces all inherited headers from server block (Brief Rule 4).
    # --------------------------------------------------------------------------
    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Repeated Security Headers (Inheritance fix)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Versioned Stylesheets: Immutable Cache Headers (Brief Section 18)
    # site.css is versioned with ?v=... so it can be cached indefinitely.
    # --------------------------------------------------------------------------
    location ~* \.css$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Repeated Security Headers (Inheritance fix)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # HTML Pages, Sitemap, Robots & Short-lived Routes
    # --------------------------------------------------------------------------
    location ~* \.(html|xml|txt|json)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";

        # Repeated Security Headers (Inheritance fix)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri $uri.html $uri/ =404;
    }

    # --------------------------------------------------------------------------
    # App Links & Universal Links (iOS & Android)
    # --------------------------------------------------------------------------
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Backend API & WebSocket Reverse Proxy (Node.js backend on port 3000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket connection for live voice calls
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Default fallback to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

